<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Content Fragments</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://da.live/nx2/styles/styles.css">
    <link rel="stylesheet" href="./panel.css">
    <script type="module" src="./panel.js"></script>
  </head>
  <body>
    <main>
      <header>
        <div class="top">
          <p class="eyebrow">AEM Content Fragments</p>
          <button id="setup-open" type="button" class="link" hidden>Setup</button>
        </div>
        <h1>On this page <span id="count" class="count">0</span></h1>
        <p class="muted">Author content from <span id="author">AEM</span>, read and saved through the broker.</p>
      </header>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="setup" class="setup" hidden></section>
      <ul id="refs" class="refs"></ul>
      <section class="place" aria-labelledby="place-title">
        <h2 id="place-title">Place a Content Fragment</h2>
        <p class="muted">Put the cursor on an empty line between sections, then pick fragments. Each one is added as its own section.</p>
        <div class="actions"><button id="browse" type="button" aria-haspopup="dialog">Browse with Content Advisor</button></div>
      </section>
      <div id="advisor" hidden></div>
      <div id="advisor-actions" class="actions" hidden>
        <button id="advisor-cancel" type="button">Cancel</button>
        <button id="advisor-insert" type="button" class="primary" disabled>Insert</button>
      </div>
    </main>
  </body>
</html>
